# 服务器部署样例：把本文件与 .env.server 一起放到服务器同一目录后，
# 在 deploy 目录执行：docker compose up -d --build
services:
  renderer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: resume-pdf-renderer:1.0.0
    container_name: rpr
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 配置通过环境变量注入，不打进镜像（相当于 Java 项目的外部配置文件）
    env_file:
      - .env.server
    volumes:
      # 产物目录挂到宿主机，容器重建不丢数据
      - ./artifacts:/data/artifacts
    # Chromium 需要较大的共享内存与足够的进程数
    shm_size: "256m"
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
