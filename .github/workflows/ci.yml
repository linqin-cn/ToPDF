name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          enable-cache: true

      - name: 安装 Python 与依赖
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Lint 与格式检查
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 类型检查
        run: uv run mypy

      - name: 契约校验
        run: |
          uv run python scripts/validate_openapi.py
          uv run python scripts/validate_openapi.py docs/04-openapi.agent.yaml
          uv run python scripts/build_agent_spec.py --check

      - name: 单元测试
        run: uv run pytest tests/unit -q

  container-smoke:
    name: 镜像构建与冒烟
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t resume-pdf-renderer:ci .

      - name: 启动容器并检查存活探针
        run: |
          docker run -d --name rpr -p 8000:8000 resume-pdf-renderer:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "服务未在超时内就绪" >&2
          exit 1

      - name: 输出容器日志
        if: always()
        run: docker logs rpr

      - name: 清理
        if: always()
        run: docker rm -f rpr
